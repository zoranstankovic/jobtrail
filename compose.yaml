name: jobtrail

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: jobtrail
      POSTGRES_USER: jobtrail
      POSTGRES_PASSWORD: secret
    volumes:
      # PostgreSQL 18 moved PGDATA to a version-specific directory and
      # declares /var/lib/postgresql as the volume. Mounting the old
      # /var/lib/postgresql/data path would silently lose data.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail -d jobtrail"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    healthcheck:
      # The entrypoint touches this file on its last line, so "healthy"
      # means composer install + migrations are done.
      test: ["CMD-SHELL", "test -f /tmp/app-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s

  web:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  vite:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    depends_on:
      app:
        condition: service_healthy
    # The image's ENTRYPOINT runs migrations and php-fpm; this container only
    # needs Node, so it is overridden. The script is read from the mounted
    # checkout, so it needs no executable bit.
    entrypoint: ["/bin/sh", "docker/vite/start.sh"]
    working_dir: /var/www/html
    environment:
      VITE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  pgadmin:
    image: dpage/pgadmin4:9
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jobtrail.local
      PGADMIN_DEFAULT_PASSWORD: secret
      # pgAdmin 9 rejects .local addresses: RFC 6761 reserves it, and the
      # image's entrypoint refuses to create the initial user. This allows it
      # so the credentials documented in docs/design.md §10 still work.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
      # Without this pgAdmin asks for a second "master password" before it
      # will open a saved server connection.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin:
