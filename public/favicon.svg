<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <style>
        .tile { fill: #171717; }
        .dot { fill: #fafafa; }
        .goal { fill: none; stroke: #fafafa; }
        @media (prefers-color-scheme: dark) {
            .tile { fill: #fafafa; }
            .dot { fill: #171717; }
            .goal { stroke: #171717; }
        }
    </style>
    <rect class="tile" width="32" height="32" rx="7"/>
    <circle class="dot" cx="7.5" cy="25" r="1.6"/>
    <circle class="dot" cx="12.5" cy="23.5" r="1.8"/>
    <circle class="dot" cx="15.5" cy="18.5" r="2"/>
    <circle class="goal" cx="21.5" cy="11" r="4.2" stroke-width="2.6"/>
</svg>
